<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stage Design System</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   AMSAFE BRIDPORT — BIG SCREEN STAGE DESIGN SYSTEM
   Tokens + shared primitives (.ev-) for the raffle (.rf-) and voting (.vt-)
   big-screen React components. This file is the review/reference page;
   .docs- classes below belong ONLY to this review page, never to the
   portable component library.
   ========================================================================== */

:root {
  color-scheme: dark;

  /* ---- Navy scale -------------------------------------------------- */
  --navy-950:#060b18;
  --navy-900:#0a1428;
  --navy-800:#102544;
  --navy-700:#17335e;
  --navy-600:#204378;
  --navy-500:#2c5697;

  /* ---- Electric accent (light colour) -------------------------------- */
  --accent:#4f7fe0;
  --accent-bright:#7fa6ff;

  /* ---- Silver scale --------------------------------------------------- */
  --silver-100:#eef1f6;
  --silver-200:#dde3ec;
  --silver-300:#c3cbda;
  --silver-400:#9aa5ba;
  --silver-500:#707d94;

  /* ---- Gold: rare celebration accent ONLY. Single token pair so it can
     be pulled out wholesale if the gold accent is ever dropped. -------- */
  --gold:#e0b64c;
  --gold-bright:#f5d888;

  /* ---- Semantic status (countdown urgency, badges) -------------------- */
  --success:#49d69b;
  --warning:#f5b942;
  --critical:#ef5a6f;

  /* ---- Brand marks — Logo component ONLY. Never used as UI chrome. --- */
  --brand-red:#ff0000;
  --brand-red-deep:#c20000;
  --brand-blue:#001f98;
  --brand-blue-bright:#2c46c9;

  /* ---- Type ------------------------------------------------------------
     Two families total, per the venue constraint:
     display = Big Shoulders Display (headlines, numerals, reveals)
     body    = IBM Plex Sans (labels, captions, data, hashes)
     Numeric alignment (countdown, hash groups, vote counts) uses
     font-variant-numeric: tabular-nums on the body face instead of a
     third monospace family. ------------------------------------------- */
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* Type scale for a 1080p stage, viewed from 10–40m.
     Minimums from the brief: body 28px+, key info 48px+, countdown 220px+,
     winner name 110px+. */
  --fs-caption: 28px;
  --fs-body: 32px;
  --fs-label: 36px;
  --fs-subhead: 48px;
  --fs-head: 64px;
  --fs-display: 96px;
  --fs-countdown: 220px;
  --fs-winner: 120px;

  /* ---- Spacing ---------------------------------------------------------- */
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 48px;
  --space-6: 64px;
  --space-7: 96px;
  --space-8: 128px;

  /* ---- Radius ------------------------------------------------------------ */
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;

  /* ---- Motion ------------------------------------------------------------
     Cinematic ease-out curves + a shared duration scale. */
  --ease-out-expo: cubic-bezier(.16,1,.3,1);
  --ease-out-back: cubic-bezier(.34,1.56,.64,1);
  --ease-standard: cubic-bezier(.4,0,.2,1);
  --dur-fast: 180ms;
  --dur-med: 360ms;
  --dur-slow: 720ms;
  --dur-cinematic: 3000ms;

  /* Projector overscan safe margin */
  --safe-margin: 4.5%;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--navy-950);
  color: var(--silver-100);
  font-family: var(--font-body);
}

/* ==========================================================================
   ev- SHARED PRIMITIVES — portable, reused by both raffle and voting screens
   ========================================================================== */

/* ---- StageBackground -------------------------------------------------- */
.ev-stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  isolation: isolate;
  background: radial-gradient(120% 90% at 50% -10%, var(--navy-700) 0%, var(--navy-900) 48%, var(--navy-950) 100%);
}
.ev-stage__beam {
  position: absolute;
  inset: -25%;
  background:
    conic-gradient(from 210deg at 28% 18%, transparent 0deg, rgba(127,166,255,.16) 36deg, transparent 92deg),
    conic-gradient(from 20deg at 82% 8%, transparent 0deg, rgba(127,166,255,.10) 30deg, transparent 70deg);
  mix-blend-mode: screen;
  opacity: .65;
  animation: ev-beam-drift 48s linear infinite;
  will-change: transform;
}
.ev-stage--live .ev-stage__beam { opacity: .8; animation-duration: 34s; }
.ev-stage--celebration .ev-stage__beam {
  background:
    conic-gradient(from 210deg at 28% 18%, transparent 0deg, rgba(245,216,136,.22) 36deg, transparent 92deg),
    conic-gradient(from 20deg at 82% 8%, transparent 0deg, rgba(127,166,255,.14) 30deg, transparent 70deg);
  opacity: .9;
  animation-duration: 26s;
}
@keyframes ev-beam-drift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.ev-stage__grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(197,210,235,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(197,210,235,.05) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(60% 60% at 50% 42%, #000, transparent 78%);
  mask-image: radial-gradient(60% 60% at 50% 42%, #000, transparent 78%);
}
.ev-stage__particles { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
.ev-stage__vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(78% 68% at 50% 46%, transparent 52%, rgba(6,11,24,.78) 100%);
}
.ev-stage--celebration .ev-stage__vignette {
  background: radial-gradient(78% 68% at 50% 46%, transparent 52%, rgba(24,16,4,.55) 100%);
}
.ev-stage__content { position: relative; z-index: 2; width: 100%; height: 100%; }

/* ---- LiveBadge ----------------------------------------------------------- */
.ev-badge {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: 12px 28px;
  border-radius: var(--radius-pill);
  background: linear-gradient(180deg, rgba(23,51,94,.75), rgba(10,20,40,.85));
  border: 1px solid rgba(195,203,218,.22);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-family: var(--font-body); font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  font-size: var(--fs-caption);
  color: var(--silver-200);
  white-space: nowrap;
}
.ev-badge__dot { width: 12px; height: 12px; border-radius: 50%; background: var(--silver-400); flex: none; }
.ev-badge--live .ev-badge__dot { background: var(--accent-bright); animation: ev-pulse-dot 1.5s ease-in-out infinite; }
.ev-badge--live { color: var(--silver-100); border-color: rgba(127,166,255,.45); }
.ev-badge--drawing .ev-badge__dot { background: var(--gold-bright); animation: ev-pulse-dot .95s ease-in-out infinite; }
.ev-badge--drawing { color: var(--gold-bright); border-color: rgba(224,182,76,.5); }
.ev-badge--sealing .ev-badge__dot { background: var(--accent-bright); animation: ev-pulse-dot 2.2s ease-in-out infinite; }
.ev-badge--final .ev-badge__dot { background: var(--gold); }
.ev-badge--final { color: var(--gold-bright); border-color: rgba(224,182,76,.5); }
.ev-badge--complete .ev-badge__dot { background: var(--silver-400); }
.ev-badge--waiting .ev-badge__dot, .ev-badge--coming-up .ev-badge__dot { background: var(--silver-500); }
@keyframes ev-pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: .55; }
}
@media (prefers-reduced-motion: reduce) {
  .ev-badge__dot { animation: none !important; }
}

/* ---- Countdown ------------------------------------------------------------ */
.ev-countdown {
  font-family: var(--font-display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  font-size: var(--fs-countdown);
  line-height: 1;
  color: var(--silver-100);
  letter-spacing: .01em;
  text-shadow: 0 0 50px rgba(79,127,224,.35);
  display: inline-block;
}
.ev-countdown__seg { display: inline-block; animation: ev-tick .22s var(--ease-out-expo); }
.ev-countdown--warning { color: var(--gold-bright); text-shadow: 0 0 60px rgba(224,182,76,.45); }
.ev-countdown--critical {
  color: #ffe3e3;
  text-shadow: 0 0 70px rgba(239,90,111,.65);
  animation: ev-countdown-pulse 1s ease-in-out infinite;
}
.ev-countdown--closed { color: var(--silver-500); text-shadow: none; font-size: var(--fs-head); text-transform: uppercase; letter-spacing: .08em; }
@keyframes ev-tick { from { transform: translateY(-.08em) scale(1.06); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes ev-countdown-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@media (prefers-reduced-motion: reduce) {
  .ev-countdown__seg { animation: none; }
  .ev-countdown--critical { animation: none; }
}

/* ---- QrSlot ---------------------------------------------------------------- */
.ev-qr { display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-3); }
.ev-qr__card {
  position: relative;
  width: 320px; height: 320px;
  background: var(--silver-100);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 1px rgba(255,255,255,.7), 0 24px 70px rgba(6,11,24,.55);
}
.ev-qr__frame {
  position: absolute; inset: -8px;
  border-radius: calc(var(--radius-lg) + 8px);
  border: 2px solid var(--accent-bright);
  opacity: .55;
  animation: ev-qr-breathe 3.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes ev-qr-breathe { 0%, 100% { opacity: .45; } 50% { opacity: .85; } }
.ev-qr__img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ev-qr__placeholder { width: 100%; height: 100%; opacity: .3; color: var(--navy-700); }
.ev-qr__label {
  font-family: var(--font-display); font-weight: 700;
  font-size: var(--fs-subhead); color: var(--silver-100);
  text-transform: uppercase; letter-spacing: .04em;
}
.ev-qr__url { font-family: var(--font-body); font-size: var(--fs-body); color: var(--silver-300); }
@media (prefers-reduced-motion: reduce) { .ev-qr__frame { animation: none; opacity: .65; } }

/* ---- Avatar ------------------------------------------------------------- */
.ev-avatar {
  position: relative;
  border-radius: 50%;
  overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  flex: none;
  background: linear-gradient(160deg, var(--navy-600), var(--navy-850, var(--navy-800)));
  color: var(--silver-100);
  font-family: var(--font-display); font-weight: 700;
}
.ev-avatar--sm { width: 64px; height: 64px; font-size: 24px; }
.ev-avatar--md { width: 96px; height: 96px; font-size: 34px; }
.ev-avatar--lg { width: 160px; height: 160px; font-size: 56px; }
.ev-avatar--xl { width: 280px; height: 280px; font-size: 96px; }
.ev-avatar__ring {
  position: absolute; inset: 0; border-radius: 50%;
  border: 6px solid var(--silver-300);
  box-shadow: 0 0 0 2px rgba(6,11,24,.65), 0 0 42px rgba(159,171,196,.35);
}
.ev-avatar--premium .ev-avatar__ring {
  border-color: var(--gold-bright);
  box-shadow: 0 0 0 2px rgba(6,11,24,.65), 0 0 54px rgba(224,182,76,.55);
}
.ev-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---- AnimatedNumber -------------------------------------------------------- */
.ev-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* ---- GlassPanel ------------------------------------------------------------ */
.ev-glass {
  position: relative;
  background: linear-gradient(180deg, rgba(23,51,94,.55), rgba(10,20,40,.68));
  border: 1px solid rgba(221,227,236,.16);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 70px rgba(6,11,24,.45);
  padding: var(--space-4);
}
.ev-glass::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
  background: linear-gradient(135deg, rgba(255,255,255,.45), transparent 42%, transparent 58%, rgba(159,171,196,.28));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none;
}

/* ---- MetalText -------------------------------------------------------------- */
.ev-metal {
  font-family: var(--font-display); font-weight: 700;
  position: relative; display: inline-block;
  background: linear-gradient(180deg, var(--silver-100) 0%, var(--silver-300) 42%, var(--silver-500) 54%, var(--silver-200) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.ev-metal--gold { background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 50%, #fff2cf 100%); -webkit-background-clip: text; background-clip: text; }
.ev-metal--sweep::after {
  content: attr(data-text);
  position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%);
  background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: ev-metal-sweep 4.5s linear infinite;
}
@keyframes ev-metal-sweep { 0% { background-position: 160% 0; } 100% { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .ev-metal--sweep::after { animation: none; display: none; } }

/* ---- Confetti ----------------------------------------------------------------- */
.ev-confetti-canvas { position: absolute; inset: 0; pointer-events: none; }

/* ---- Logo ------------------------------------------------------------------- */
.ev-logo { display: inline-block; width: var(--logo-size, 240px); line-height: 0; color: var(--silver-100); }
.ev-logo__svg { width: 100%; height: auto; display: block; overflow: visible; }
.ev-logo__glow { transition: opacity var(--dur-slow) var(--ease-standard); }
.ev-logo--idle .ev-logo__glow { animation: ev-logo-breathe 4.2s ease-in-out infinite; }
.ev-logo--static .ev-logo__glow { opacity: .55; }
.ev-logo--intro .ev-logo__glow { opacity: 0; animation: ev-logo-glow-in var(--dur-slow) var(--ease-out-back) 2.5s forwards; }
@keyframes ev-logo-breathe { 0%, 100% { opacity: .45; } 50% { opacity: .85; } }
@keyframes ev-logo-glow-in { from { opacity: 0; } to { opacity: .6; } }

.ev-logo__wipe { transform: translateX(-105%); }
.ev-logo--intro .ev-logo__wipe { animation: ev-logo-wipe 2.6s var(--ease-out-expo) forwards; }
.ev-logo--idle .ev-logo__wipe, .ev-logo--static .ev-logo__wipe { transform: translateX(0%); }
@keyframes ev-logo-wipe { from { transform: translateX(-105%); } to { transform: translateX(0%); } }

.ev-logo__sweepBar { transform: translateX(-140%); opacity: 0; }
.ev-logo--intro .ev-logo__sweepBar { animation: ev-logo-sweep-once 1.1s var(--ease-standard) 2.2s both; }
.ev-logo--idle .ev-logo__sweepBar { animation: ev-logo-sweep-loop 6s linear infinite; animation-delay: .6s; }
@keyframes ev-logo-sweep-once {
  0% { transform: translateX(-140%); opacity: 0; }
  15% { opacity: .9; }
  100% { transform: translateX(140%); opacity: 0; }
}
@keyframes ev-logo-sweep-loop {
  0% { transform: translateX(-140%); opacity: 0; }
  45% { opacity: .55; }
  55% { opacity: .55; }
  100% { transform: translateX(140%); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .ev-logo__wipe { transform: translateX(0%) !important; animation: none !important; }
  .ev-logo--intro .ev-logo__glow { animation: none !important; opacity: .55 !important; }
  .ev-logo--intro { animation: ev-logo-fade-in .3s var(--ease-standard); }
  .ev-logo__sweepBar { animation: none !important; opacity: 0 !important; }
  .ev-logo--idle .ev-logo__glow { animation: none !important; opacity: .6 !important; }
}
@keyframes ev-logo-fade-in { from { opacity: 0; } to { opacity: 1; } }

/* ==========================================================================
   docs- REVIEW PAGE CHROME — this page only, never ported.
   ========================================================================== */
/* The page itself scrolls normally; the stage backdrop is a fixed layer
   behind it so StageBackground's own overflow:hidden/height:100% (correct
   for a locked 16:9 stage tile) never clips a tall scrolling document. */
html, body { height: auto; }
.docs-page { position: relative; min-height: 100vh; }
.docs-page__bg { position: fixed; inset: 0; z-index: 0; }
.docs-shell { position: relative; z-index: 1; }
.docs-shell { position: relative; padding: var(--space-6) var(--safe-margin) var(--space-8); max-width: 1680px; margin: 0 auto; }
.docs-header { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-5); margin-bottom: var(--space-3); }
.docs-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 4vw, 52px); margin: 0; letter-spacing: .01em; }
.docs-kicker { font-family: var(--font-body); text-transform: uppercase; letter-spacing: .18em; font-size: 14px; color: var(--silver-400); margin: 0 0 6px; }
.docs-lede { font-family: var(--font-body); font-size: 17px; line-height: 1.6; color: var(--silver-300); max-width: 62ch; margin: var(--space-2) 0 0; }
.docs-nav { position: sticky; top: 12px; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; margin: var(--space-5) 0 var(--space-7); padding: 10px; background: rgba(6,11,24,.7); backdrop-filter: blur(14px); border: 1px solid rgba(221,227,236,.12); border-radius: var(--radius-pill); }
.docs-nav a { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--silver-300); text-decoration: none; padding: 8px 16px; border-radius: var(--radius-pill); letter-spacing: .02em; }
.docs-nav a:hover { color: var(--silver-100); background: rgba(79,127,224,.16); }
.docs-section { margin-bottom: var(--space-8); scroll-margin-top: 70px; }
.docs-section__head { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-4); border-bottom: 1px solid rgba(221,227,236,.14); padding-bottom: var(--space-2); }
.docs-section__num { font-family: var(--font-display); font-size: 20px; color: var(--silver-500); }
.docs-section__title { font-family: var(--font-display); font-weight: 700; font-size: 28px; margin: 0; }
.docs-section__note { font-family: var(--font-body); font-size: 14px; color: var(--silver-400); margin: 0 0 var(--space-4); max-width: 70ch; line-height: 1.6; }
.docs-grid { display: grid; gap: var(--space-3); }
.docs-grid--colors { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.docs-swatch { border-radius: var(--radius-md); overflow: hidden; border: 1px solid rgba(221,227,236,.14); background: rgba(10,20,40,.5); }
.docs-swatch__fill { height: 76px; }
.docs-swatch__meta { padding: 10px 12px; font-family: var(--font-body); }
.docs-swatch__name { font-size: 13px; font-weight: 600; color: var(--silver-100); display: block; }
.docs-swatch__hex { font-size: 12px; color: var(--silver-400); font-variant-numeric: tabular-nums; }
.docs-type-row { display: flex; align-items: baseline; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px dashed rgba(221,227,236,.12); }
.docs-type-row__meta { width: 190px; flex: none; font-family: var(--font-body); font-size: 13px; color: var(--silver-400); }
.docs-type-row__meta b { display: block; color: var(--silver-100); font-size: 14px; }
.docs-tile { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid rgba(221,227,236,.14); aspect-ratio: 16/9; }
.docs-tile__label { position: absolute; top: var(--space-2); left: var(--space-2); z-index: 5; font-family: var(--font-body); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--silver-300); background: rgba(6,11,24,.55); padding: 5px 10px; border-radius: var(--radius-pill); }
.docs-tile__stack { display: flex; align-items: center; justify-content: center; height: 100%; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-4); }
.docs-tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-3); }
.docs-scale-row { display: flex; align-items: center; gap: var(--space-3); font-family: var(--font-body); font-size: 13px; color: var(--silver-400); }
.docs-scale-bar { height: 14px; background: linear-gradient(90deg, var(--accent), var(--accent-bright)); border-radius: 4px; }
.docs-btn { font-family: var(--font-body); font-weight: 600; font-size: 13px; letter-spacing: .03em; color: var(--navy-950); background: var(--silver-100); border: none; border-radius: var(--radius-pill); padding: 10px 20px; cursor: pointer; }
.docs-btn:hover { background: #fff; }
.docs-btn--ghost { background: transparent; color: var(--silver-200); border: 1px solid rgba(221,227,236,.3); }
.docs-btn--ghost:hover { background: rgba(221,227,236,.1); }
.docs-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--space-3); }
.docs-badgerow { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.docs-ease-card { background: rgba(10,20,40,.5); border: 1px solid rgba(221,227,236,.14); border-radius: var(--radius-md); padding: var(--space-3); font-family: var(--font-body); }
.docs-ease-card b { font-size: 13px; color: var(--silver-100); display: block; margin-bottom: 4px; }
.docs-ease-card span { font-size: 12px; color: var(--silver-400); }
.docs-ease-track { position: relative; height: 44px; margin-top: var(--space-2); background: rgba(255,255,255,.04); border-radius: 999px; }
.docs-ease-dot { position: absolute; top: 6px; left: 6px; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, var(--accent-bright), var(--accent)); }

/* ==========================================================================
   STAGE BACKGROUND
   ========================================================================== */
function StageBackground({ mood = "calm", children, className = "" }) {
  const canvasRef = useRef(null);
  const reduceMotion = usePrefersReducedMotion();

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf = null;
    let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const COUNT = reduceMotion ? 0 : 110;
    const palette = {
      calm: ["#7fa6ff", "#c3cbda", "#4f7fe0"],
      live: ["#7fa6ff", "#eef1f6", "#4f7fe0"],
      celebration: ["#f5d888", "#7fa6ff", "#eef1f6"],
    }[mood] || ["#7fa6ff"];

    let particles = [];
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function seed() {
      particles = Array.from({ length: COUNT }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.4,
        s: Math.random() * 0.12 + 0.02,
        drift: (Math.random() - 0.5) * 0.06,
        o: Math.random() * 0.5 + 0.15,
        c: palette[Math.floor(Math.random() * palette.length)],
      }));
    }
    resize(); seed();
    const ro = new ResizeObserver(() => { resize(); });
    ro.observe(canvas.parentElement);

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        p.y -= p.s; p.x += p.drift;
        if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; }
        if (p.x < -4) p.x = w + 4; if (p.x > w + 4) p.x = -4;
        ctx.globalAlpha = p.o;
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!reduceMotion) raf = requestAnimationFrame(draw);
    }
    draw();
    return () => { if (raf) cancelAnimationFrame(raf); ro.disconnect(); };
  }, [mood, reduceMotion]);

  return (
    <div className={`ev-stage ev-stage--${mood} ${className}`}>
      <div className="ev-stage__beam" />
      <div className="ev-stage__grid" />
      <canvas ref={canvasRef} className="ev-stage__particles" />
      <div className="ev-stage__vignette" />
      <div className="ev-stage__content">{children}</div>
    </div>
  );
}

function usePrefersReducedMotion() {
  const [reduced, setReduced] = useState(false);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
    setReduced(mq.matches);
    const handler = (e) => setReduced(e.matches);
    mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler); };
  }, []);
  return reduced;
}

/* ==========================================================================
   COUNTDOWN
   ========================================================================== */
function formatClock(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}
function Countdown({ seconds, closed = false }) {
  if (closed) {
    return <div className="ev-countdown ev-countdown--closed">Closed</div>;
  }
  const tier = seconds <= 10 ? "critical" : seconds <= 60 ? "warning" : "normal";
  const text = formatClock(seconds);
  return (
    <div className={`ev-countdown ev-countdown--${tier}`}>
      <span className="ev-countdown__seg" key={text}>{text}</span>
    </div>
  );
}

/* ==========================================================================

   ========================================================================== */
function initials(name) {
  if (!name) return "?";
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function Avatar({ name, imageUrl, size = "md", tier = "normal" }) {
  return (
    <span className={`ev-avatar ev-avatar--${size} ${tier === "premium" ? "ev-avatar--premium" : ""}`}>
      {imageUrl ? <img src={imageUrl} alt={name || ""} /> : <span aria-hidden="true">{initials(name)}</span>}
      <span className="ev-avatar__ring" />
    </span>
  );
}

/* ==========================================================================
   ANIMATED NUMBER
   ========================================================================== */
function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function AnimatedNumber({ value, duration = 700, format }) {
  const [display, setDisplay] = useState(value);
  const fromRef = useRef(value);
  const rafRef = useRef(null);

  useEffect(() => {
    const from = fromRef.current;
    const to = value;
    if (from === to) return;
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = easeOutExpo(t);
      setDisplay(Math.round(from + (to - from) * eased));
      if (t < 1) { rafRef.current = requestAnimationFrame(step); }
      else { fromRef.current = to; }
    }
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value, duration]);

  const text = format ? format(display) : display.toLocaleString();
  return <span className="ev-num">{text}</span>;
}

/* ==========================================================================
   CONFETTI
   ========================================================================== */
function Confetti({ colors = ["#7fa6ff", "#eef1f6", "#4f7fe0"], originX = 0.5, burstKey, count = 70 }) {
  const canvasRef = useRef(null);
  const particlesRef = useRef([]);
  const rafRef = useRef(null);
  const reduceMotion = usePrefersReducedMotion();

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = 0, h = 0;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(canvas.parentElement);
    return () => ro.disconnect();
  }, []);

  useEffect(() => {
    if (burstKey === undefined || burstKey === null || reduceMotion) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const n = Math.min(count, 150);
    const originPx = w * originX;
    const fresh = Array.from({ length: n }, () => ({
      x: originPx, y: h * 0.12,
      vx: (Math.random() - 0.5) * 9,
      vy: -(Math.random() * 7 + 5),
      g: 0.28 + Math.random() * 0.08,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      w: 6 + Math.random() * 7,
      h: 4 + Math.random() * 6,
      c: colors[Math.floor(Math.random() * colors.length)],
      life: 0, maxLife: 90 + Math.random() * 40,
    }));
    particlesRef.current = particlesRef.current.concat(fresh).slice(-150);

    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    function step() {
      const dpr2 = Math.min(window.devicePixelRatio || 1, 2);
      ctx.save();
      ctx.setTransform(dpr2, 0, 0, dpr2, 0, 0);
      ctx.clearRect(0, 0, w, h);
      let alive = false;
      for (const p of particlesRef.current) {
        p.life += 1;
        if (p.life > p.maxLife) continue;
        alive = true;
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr;
        const fade = 1 - Math.max(0, (p.life - p.maxLife * 0.7) / (p.maxLife * 0.3));
        ctx.globalAlpha = Math.max(0, Math.min(1, fade));
        ctx.fillStyle = p.c;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
      particlesRef.current = particlesRef.current.filter((p) => p.life <= p.maxLife);
      if (alive) rafRef.current = requestAnimationFrame(step);
    }
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [burstKey]);

  return <canvas ref={canvasRef} className="ev-confetti-canvas" aria-hidden="true" />;
}

/* Deterministic pseudo-random module grid, standing in for a real QR image
   in this demo only — the raffle/voting screens receive a real dataUrl. */
function PseudoQrArt() {
  const cells = useMemo(() => {
    let seed = 1337;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed / 0x7fffffff); };
    const arr = [];
    for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
      const finder = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
      arr.push(finder ? ((x % 6 < 4 && y % 6 < 4) ? 1 : ((x + y) % 5 === 0 ? 1 : 0)) : (rnd() > 0.56 ? 1 : 0));
    }
    return arr;
  }, []);
  return (
    <svg viewBox="0 0 21 21" width="100%" height="100%">
      {cells.map((v, i) => v ? <rect key={i} x={i % 21} y={Math.floor(i / 21)} width="1" height="1" fill="var(--navy-900)" /> : null)}
    </svg>
  );
}
